<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Display</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>Live Display of Input</h1>
    <h3>Enter Your Details</h3>
    <label id="name">Name : </label>
    <input id="name" type="text" placeholder="Enter Name">
    <label id="email">Email : </label>
    <input id="email" type="email" placeholder="Enter Email">
    <label id="age">Age : </label>
    <input id="age" type="number" placeholder="Enter Age"> <br><br>

    <div class="output">
        <h3>Your Data</h3>
        <p >Your Name : <span id="out-name">-</span></p>
        <p >Your Email: <span id="out-email">-</span></p>
        <p >Your Age : <span id="out-age">-</span></p>
    </div>


    <script src="./script.js"></script>
</body>
</html>
