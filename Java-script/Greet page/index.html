<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Java-script</title>
</head>
<body>
    <section class="head">
        <div class="header"><p id="heading">Hello</p></div>
    </section>

    <section class="main">
        <div class="box-1" id="box1">Red</div>
        <div class="box-2" id="box2">Blue</div>
        <div class="box-3" id="box3">Green</div>
        <div class="box-4" id="box4">Yellow</div>
    </section>

    <section class="form">
        <form action="#" class="plate">
            <input class="name" id="name" type="text" placeholder="Name Please">
            <button id="btn">Greet</button>
        </form>
    </section>

    <script src="script.js"></script>
</body>
</html>
